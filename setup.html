<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einrichtung</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 20px; max-width: 560px; margin: 0 auto; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    textarea { min-height: 120px; font-family: monospace; font-size: .8rem; }
    .ok { color: #2e8b57; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🔑 Passwort einrichten</h1>
  <p class="hint">Alles passiert nur in deinem Browser, nichts wird gesendet.</p>

  <label for="tok">GitHub-Token (Contents: Read and write)</label>
  <input id="tok" type="password" autocomplete="off" placeholder="github_pat_...">

  <label for="pw">Dein Passwort für die Admins</label>
  <input id="pw" type="text" autocomplete="off" placeholder="Mindestens 12 Zeichen empfohlen">

  <p><button id="go">Verschlüsseln</button></p>

  <div id="out" hidden>
    <p class="ok">Fertig! Diese Zeile kopieren:</p>
    <textarea id="result" readonly></textarea>
    <p><button id="copy">Kopieren</button></p>
    <p class="hint">Jetzt auf GitHub die Datei <b>config.js</b> öffnen (Stift-Symbol), den Inhalt komplett durch die kopierte Zeile ersetzen und speichern (Commit changes).</p>
  </div>

<script>
const b64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
document.getElementById('go').addEventListener('click', async () => {
  const token = document.getElementById('tok').value.trim();
  const pw = document.getElementById('pw').value;
  if (!token || !pw) return alert('Bitte Token und Passwort eingeben.');
  if (pw.length < 8) return alert('Das Passwort ist zu kurz (mindestens 8, besser 12+ Zeichen).');
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(token)));
  const blob = btoa(JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(ct) }));
  document.getElementById('result').value = 'const LOCKED = "' + blob + '";';
  document.getElementById('out').hidden = false;
});
document.getElementById('copy').addEventListener('click', async () => {
  const el = document.getElementById('result');
  el.select();
  try { await navigator.clipboard.writeText(el.value); alert('Kopiert'); } catch { document.execCommand('copy'); }
});
</script>
</body>
</html>
